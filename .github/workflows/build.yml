# Compiles every kernel file. GitHub-hosted runners have no GPU, so the
# programs are only built here.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04   # dev container

    steps:
      - uses: actions/checkout@v4

      - name: Compile all kernels
        run: |
          mkdir -p build
          for f in *.cu; do
            echo "== $f"
            nvcc -arch=sm_75 -o "build/${f%.cu}" "$f"
          done
